services:
  cloud-prism:
    build: .
    container_name: cloud-prism
    ports:
      - "3080:3080"
    environment:
      - PORT=3080
      - TZ=Asia/Seoul
      - DB_PATH=/data/sync_state.db
      - TMP_DIR=/tmp/mybox_sync
      # 모든 토큰·URL·옵션은 웹 대시보드(:3080)의 [환경 설정] 탭에서 입력 시 /data/settings.json에 영구 저장됩니다.
      # (선택) 초기 기본값을 환경변수로 미리 주입하고 싶을 때만 아래 항목을 설정하세요.
      - TAKEOUT_DIR=${TAKEOUT_DIR:-/data/takeout}
    volumes:
      # TrueNAS SCALE 예시: /mnt/<Pool이름>/apps/cloud-prism:/data
      - ./data:/data
    tmpfs:
      # ZFS 디스크 쓰기(CoW) 및 스냅샷 부풀림 방지를 위해 임시 다운로드는 RAM(tmpfs)에서 처리 후 즉시 삭제 (대용량 256MB+ 파일은 /data/.tmp_sync로 자동 우회)
      - /tmp/mybox_sync:size=2G,mode=1777
    restart: unless-stopped
